name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pi: ["0.85.1", "0.86.0", "0.86.1", "latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Pi compatibility version
        if: matrix.pi != '0.85.1'
        env:
          PI_TEST_VERSION: ${{ matrix.pi }}
        run: |
          pi_version=$(pnpm view "@earendil-works/pi-coding-agent@$PI_TEST_VERSION" version)
          echo "Testing Pi $pi_version ($PI_TEST_VERSION)"
          pnpm add -D --save-exact "@earendil-works/pi-ai@$pi_version" "@earendil-works/pi-coding-agent@$pi_version" "@earendil-works/pi-tui@$pi_version"

      - name: Run tests
        run: pnpm test

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint
